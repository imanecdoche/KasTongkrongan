<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="danaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1890FF"/>
      <stop offset="50%" stop-color="#118EEA"/>
      <stop offset="100%" stop-color="#0A6CBD"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD666"/>
      <stop offset="100%" stop-color="#FAAD14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A6CBD" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#danaGrad)"/>
  
  <!-- Decorative Background Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="white" stroke-width="8" stroke-opacity="0.15" stroke-dasharray="16 12"/>
  
  <!-- Wallet / Vault Body -->
  <g filter="url(#glow)">
    <!-- Base Card / Wallet Outer -->
    <rect x="116" y="146" width="280" height="220" rx="36" fill="#FFFFFF" fill-opacity="0.96"/>
    
    <!-- Top flap line -->
    <path d="M 116 190 Q 256 220 396 190" fill="none" stroke="#E6F4FF" stroke-width="4"/>
    
    <!-- Clasp / Fastener -->
    <rect x="290" y="226" width="106" height="60" rx="24" fill="#0E77C7"/>
    <circle cx="365" cy="256" r="12" fill="url(#goldGrad)"/>
    
    <!-- People / Community Badge (Tongkrongan) -->
    <g transform="translate(150, 210)">
      <!-- Left person -->
      <circle cx="36" cy="30" r="14" fill="#118EEA" fill-opacity="0.85"/>
      <path d="M 16 70 A 20 20 0 0 1 56 70 Z" fill="#118EEA" fill-opacity="0.85"/>
      
      <!-- Right person -->
      <circle cx="86" cy="30" r="14" fill="#118EEA" fill-opacity="0.85"/>
      <path d="M 66 70 A 20 20 0 0 1 106 70 Z" fill="#118EEA" fill-opacity="0.85"/>
      
      <!-- Center Main Person -->
      <circle cx="61" cy="22" r="16" fill="#0A6CBD"/>
      <path d="M 39 68 A 22 22 0 0 1 83 68 Z" fill="#0A6CBD"/>
    </g>

    <!-- Indonesian Rupiah 'Rp' Coin Emblem on Bottom Left -->
    <g transform="translate(130, 290)">
      <circle cx="32" cy="32" r="28" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="3"/>
      <text x="32" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#784400" text-anchor="middle">Rp</text>
    </g>
  </g>

  <!-- Sparkling / Verified Star Badge -->
  <g transform="translate(370, 110)">
    <circle cx="30" cy="30" r="26" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 30 14 L 34 24 L 45 26 L 37 34 L 39 45 L 30 39 L 21 45 L 23 34 L 15 26 L 26 24 Z" fill="#FFFFFF"/>
  </g>
</svg>
